services:

  redis:
    container_name: redis_transactions_case
    image: redis:8.10-alpine
    restart: on-failure
    ports:
    - "6379:6379"

  postgres:
    container_name: pg_transactions_case
    image: postgres:18-alpine
    restart: on-failure
    environment:
      POSTGRES_DB: transactions
      POSTGRES_USER: transactions_usr
      POSTGRES_PASSWORD: local_pass
    ports:
    - "5432:5432"
    volumes:
    - pgdata:/var/lib/postgresql/data


  openbserver:
    container_name: openobserve_case
    image: public.ecr.aws/zinclabs/openobserve:latest
    volumes:
    - openobserve:/data
    environment:
      ZO_ROOT_USER_EMAIL: "root@example.com" 
      ZO_ROOT_USER_PASSWORD: "Complexpass#123" 
      ZO_LOCAL_MODE: true
      ZO_CREATE_ORG_THROUGH_INGESTION: true
    ports:
    - "5080:5080"

  application:
    container_name: transactions_case
    build:
      context: .
    environment:
      DATABASE_HOST: postgres
      DATABASE_NAME: transactions
      DATABASE_PORT: 5432
      DATABASE_USER: transactions_usr
      DATABASE_PASSWORD: local_pass
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OPENOBSERVE_AUTH_TOKEN: Basic cm9vdEBleGFtcGxlLmNvbTpDb21wbGV4cGFzcyMxMjM=
      OTEL_METRICS_URL: http://openbserver:5080/api/pgjbz/v1/metrics
      OTEL_TRACE_URL: http://openbserver:5080/api/pgjbz/v1/traces
      OTEL_LOG_URL: http://openbserver:5080/api/pgjbz/v1/logs
    ports:
    - "8080:8080"
    depends_on:
    - postgres
    - redis
    - openbserver
    

volumes:
  pgdata:
  openobserve: