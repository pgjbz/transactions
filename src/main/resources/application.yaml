springdoc:
  swagger-ui:
    path: /swagger
  api-docs:
    path: /api-docs

spring:
  application:
    name: transactions
  datasource:
    url: jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:transactions}
    username: ${DATABASE_USER:transactions_usr}
    password: ${DATABASE_PASSWORD:local_pass}
  flyway:
    enabled: true
  jackson:
    property-naming-strategy: SNAKE_CASE

management:
  endpoints:
    web:
      exposure:
        include: health