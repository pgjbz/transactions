springdoc:
  swagger-ui:
    path: /swagger
  api-docs:
    path: /api-docs

spring:
  application:
    name: transactions
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cache:
    type: redis
    cache-names: accounts, transactions
    redis:
      time-to-live: 10m          
      cache-null-values: false 
      use-key-prefix: true
  datasource:
    url: jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:transactions}
    username: ${DATABASE_USER:transactions_usr}
    password: ${DATABASE_PASSWORD:local_pass}
  flyway:
    enabled: true
  jackson:
    property-naming-strategy: SNAKE_CASE

management:
  endpoints:
    web:
      exposure:
        include: health
  tracing:
    sampling:
      probability: 1.0 
  otlp:
    metrics:
      export:
        url: ${OTEL_METRICS_URL:http://localhost:5080/api/pgjbz/v1/metrics}
        headers:
          Authorization: ${OTEL_AUTH_TOKEN}

  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_TRACE_URL:http://localhost:5080/api/pgjbz/v1/traces}
          headers:
            Authorization: ${OTEL_AUTH_TOKEN}
    logging:
      export:
        otlp:
          endpoint: ${OTEL_LOG_URL:http://localhost:5080/api/pgjbz/v1/logs}
          headers:
            Authorization: ${OTEL_AUTH_TOKEN}
            stream-name: "transactions"
logging:
  include-application-name: true
  structured:
    format:
      console: ecs
